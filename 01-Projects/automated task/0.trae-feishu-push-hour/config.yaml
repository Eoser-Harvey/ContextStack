# X推文推送系统配置

# 关注的X用户
users:
  - username: elonmusk
    display_name: 马斯克
    user_id: "44196397"
  - username: cz_binance
    display_name: CZ (赵长鹏)
    user_id: "902926941413453824"
  - username: realDonaldTrump
    display_name: 特朗普
    user_id: "25073877"
  - username: aleaborteddit
    display_name: Serenity (白毛股神)
    user_id: ""

# 推文获取配置
fetch:
  # 方案1: Nitter RSS (免费)
  nitter_instances:
    - https://nitter.net
    - https://nitter.poast.org
    - https://nitter.privacydev.net
  # 每次获取最新推文数
  tweets_per_user: 5
  # 超时时间(秒)
  timeout: 30

# 翻译配置 (使用免费翻译API)
translate:
  engine: google  # google / bing / deepl
  source_lang: auto
  target_lang: zh-CN

# Server酱推送配置
server_chan:
  # 从 https://sct.ftqq.com/ 获取 SendKey
  send_key: "YOUR_SEND_KEY_HERE"

# 个人画像 — 已迁移至 profile_loader.py 动态加载
# 不再硬编码在 config.yaml 中。运行时会自动从
# profile_archive/ 目录下取最新 profile_YYYYMMDD.md
# 如需更新个人资料，请更新 profile_archive/ 中的档案文件

# 输出配置
output:
  history_file: tweet_history.json
  max_history: 50  # 周清理后无需缓存太多
