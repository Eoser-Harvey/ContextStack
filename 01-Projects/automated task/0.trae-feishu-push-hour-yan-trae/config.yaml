# 推文获取配置
fetch:
  # 方案1: Nitter RSS (免费)
  nitter_instances:
    - https://nitter.net
    - https://nitter.poast.org
    - https://nitter.privacydev.net
  # 每次获取最新推文数
  tweets_per_user: 5
  # 超时时间(秒)
  timeout: 30

# 翻译配置 (使用免费翻译API)
translate:
  engine: google  # google / bing / deepl
  source_lang: auto
  target_lang: zh-CN

# Server酱推送配置
server_chan:
  # 从 https://sct.ftqq.com/ 获取 SendKey
  send_key: "YOUR_SEND_KEY_HERE"

